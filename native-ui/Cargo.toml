[package]
name = "lumenic_cvr_ui"
version = "0.3.4"
edition = "2021"
description = "Lumenic native offscreen UI library for ChilloutVR (LumenicMenu)"

[lib]
name = "lumenic_cvr_ui"
crate-type = ["cdylib", "rlib"]

[features]
demo = []

[[bin]]
name = "demo"
path = "src/bin/demo.rs"
required-features = ["demo"]

[dependencies]
lumenic = { git = "https://github.com/LensError/Lumenic", default-features = false, features = ["clipboard"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
overflow-checks = true
